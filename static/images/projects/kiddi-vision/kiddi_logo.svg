<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- 机器人外壳渐变 -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- 屏幕玻璃渐变 -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- 眼睛发光青蓝渐变 -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- 左天线暖阳金渐变 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 右天线灵动青渐变 -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- 投影与光晕滤镜 -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 图标底板 (现代圆角 Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- 环形科技背景微光 -->
  <circle cx="256" cy="270" r="180" fill="#3B82F6" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="256" cy="270" r="130" fill="#38BDF8" opacity="0.1" filter="url(#softGlow)" />

  <!-- ================= 顶部双天线 ================= -->
  <!-- 左天线连杆 -->
  <path d="M 210,180 Q 185,130 165,95" fill="none" stroke="#94A3B8" stroke-width="14" stroke-linecap="round" />
  <!-- 右天线连杆 -->
  <path d="M 302,180 Q 327,130 347,95" fill="none" stroke="#94A3B8" stroke-width="14" stroke-linecap="round" />

  <!-- 左天线发光金球 -->
  <g filter="url(#softGlow)">
    <circle cx="165" cy="95" r="26" fill="url(#goldGrad)" />
    <circle cx="157" cy="87" r="7" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- 右天线发光青球 -->
  <g filter="url(#softGlow)">
    <circle cx="347" cy="95" r="26" fill="url(#cyanGrad)" />
    <circle cx="339" cy="87" r="7" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- 伴随的知识星芒 -->
  <!-- 左上小金星 -->
  <path d="M 120,80 Q 120,95 135,95 Q 120,95 120,110 Q 120,95 105,95 Q 120,95 120,80 Z" fill="#FDE047" opacity="0.85" filter="url(#starGlow)" />
  <!-- 右上小青星 -->
  <path d="M 395,75 Q 395,90 410,90 Q 395,90 395,105 Q 395,90 380,90 Q 395,90 395,75 Z" fill="#38BDF8" opacity="0.85" filter="url(#starGlow)" />
  <circle cx="256" cy="70" r="5" fill="#F8FAFC" opacity="0.7" />

  <!-- ================= 机器人主体 ================= -->
  <g filter="url(#dropShadow)">
    <!-- 两侧可爱小耳朵/把手 -->
    <rect x="86" y="240" width="30" height="70" rx="15" fill="#60A5FA" />
    <rect x="396" y="240" width="30" height="70" rx="15" fill="#60A5FA" />
    <circle cx="101" cy="275" r="8" fill="#F59E0B" opacity="0.8" />
    <circle cx="411" cy="275" r="8" fill="#38BDF8" opacity="0.8" />

    <!-- 底部站立小脚丫 -->
    <rect x="180" y="385" width="42" height="30" rx="16" fill="#1D4ED8" />
    <rect x="290" y="385" width="42" height="30" rx="16" fill="#1D4ED8" />

    <!-- TV 机器人圆润外壳 -->
    <rect x="106" y="165" width="300" height="235" rx="58" fill="url(#bodyGrad)" />
    <!-- 顶部高光弧线 -->
    <path d="M 160,180 Q 256,170 352,180" fill="none" stroke="#93C5FD" stroke-width="6" stroke-linecap="round" opacity="0.6" />

    <!-- 内部深色护眼屏幕 -->
    <rect x="126" y="185" width="260" height="195" rx="42" fill="url(#screenGrad)" stroke="#1E293B" stroke-width="4" />

    <!-- ================= 屏幕内灵动表情 ================= -->
    <!-- 灵动左眼 -->
    <g>
      <circle cx="185" cy="265" r="28" fill="url(#eyeGrad)" filter="url(#softGlow)" />
      <!-- 大高光 -->
      <circle cx="177" cy="254" r="10" fill="#FFFFFF" />
      <!-- 小高光 -->
      <circle cx="196" cy="276" r="5" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- 灵动右眼 -->
    <g>
      <circle cx="327" cy="265" r="28" fill="url(#eyeGrad)" filter="url(#softGlow)" />
      <!-- 大高光 -->
      <circle cx="319" cy="254" r="10" fill="#FFFFFF" />
      <!-- 小高光 -->
      <circle cx="338" cy="276" r="5" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- 粉嫩元气腮红 -->
    <ellipse cx="160" cy="295" rx="14" ry="7" fill="#F472B6" opacity="0.45" />
    <ellipse cx="352" cy="295" rx="14" ry="7" fill="#F472B6" opacity="0.45" />

    <!-- 温暖微笑小嘴 -->
    <path d="M 232,295 Q 256,322 280,295" fill="none" stroke="#F59E0B" stroke-width="9" stroke-linecap="round" />
  </g>

  <!-- 底部微型光斑 -->
  <circle cx="256" cy="460" r="3" fill="#64748B" opacity="0.5" />
  <circle cx="240" cy="460" r="2" fill="#64748B" opacity="0.3" />
  <circle cx="272" cy="460" r="2" fill="#64748B" opacity="0.3" />
</svg>
