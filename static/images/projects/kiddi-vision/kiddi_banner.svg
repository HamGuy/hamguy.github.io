<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <!-- 标题文字流光渐变 -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- 机器人渐变 -->
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="60%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- 光晕与阴影滤镜 -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="botShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 16:9 背景 -->
  <rect width="1280" height="720" fill="url(#bannerBg)" />

  <!-- 科技背景网格光点与流光环 -->
  <circle cx="340" cy="380" r="280" fill="#3B82F6" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="340" cy="380" r="180" fill="#38BDF8" opacity="0.08" filter="url(#softGlow)" />
  <circle cx="1000" cy="200" r="220" fill="#6366F1" opacity="0.06" filter="url(#softGlow)" />

  <!-- 散落的探索星星 -->
  <path d="M 160,140 Q 160,155 175,155 Q 160,155 160,170 Q 160,155 145,155 Q 160,155 160,140 Z" fill="#FDE047" opacity="0.75" filter="url(#starGlow)" />
  <path d="M 520,120 Q 520,135 535,135 Q 520,135 520,150 Q 520,135 505,135 Q 520,135 520,120 Z" fill="#38BDF8" opacity="0.85" filter="url(#starGlow)" />
  <path d="M 1120,140 Q 1120,155 1135,155 Q 1120,155 1120,170 Q 1120,155 1105,155 Q 1120,155 1120,140 Z" fill="#F59E0B" opacity="0.7" filter="url(#starGlow)" />
  <path d="M 1180,520 Q 1180,530 1190,530 Q 1180,530 1180,540 Q 1180,530 1170,530 Q 1180,530 1180,520 Z" fill="#38BDF8" opacity="0.6" filter="url(#starGlow)" />

  <!-- ================= 左侧机器人吉祥物 (中心约 340, 390) ================= -->
  <g transform="translate(40, 30)">
    <!-- 顶部双天线 -->
    <path d="M 270,220 Q 240,155 215,110" fill="none" stroke="#94A3B8" stroke-width="14" stroke-linecap="round" />
    <path d="M 390,220 Q 420,155 445,110" fill="none" stroke="#94A3B8" stroke-width="14" stroke-linecap="round" />

    <!-- 发光球 -->
    <g filter="url(#softGlow)">
      <circle cx="215" cy="110" r="28" fill="#F59E0B" />
      <circle cx="207" cy="102" r="8" fill="#FFFFFF" opacity="0.8" />
    </g>
    <g filter="url(#softGlow)">
      <circle cx="445" cy="110" r="28" fill="#38BDF8" />
      <circle cx="437" cy="102" r="8" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- 机器人外壳 -->
    <g filter="url(#botShadow)">
      <!-- 把手 -->
      <rect x="135" y="290" width="30" height="75" rx="15" fill="#60A5FA" />
      <rect x="495" y="290" width="30" height="75" rx="15" fill="#60A5FA" />
      <!-- 小支脚 -->
      <rect x="235" y="455" width="46" height="36" rx="18" fill="#1D4ED8" />
      <rect x="375" y="455" width="46" height="36" rx="18" fill="#1D4ED8" />

      <!-- 主机身 -->
      <rect x="155" y="200" width="350" height="275" rx="64" fill="url(#botGrad)" />
      <!-- 顶部高光 -->
      <path d="M 215,216 Q 330,206 445,216" fill="none" stroke="#93C5FD" stroke-width="6" stroke-linecap="round" opacity="0.6" />

      <!-- 护眼深色大屏幕 -->
      <rect x="180" y="222" width="300" height="230" rx="48" fill="url(#screenGrad)" stroke="#1E293B" stroke-width="4" />

      <!-- 灵动双眼 -->
      <g>
        <circle cx="248" cy="316" r="32" fill="#38BDF8" filter="url(#softGlow)" />
        <circle cx="239" cy="304" r="11" fill="#FFFFFF" />
        <circle cx="260" cy="328" r="5.5" fill="#FFFFFF" opacity="0.9" />
      </g>
      <g>
        <circle cx="412" cy="316" r="32" fill="#38BDF8" filter="url(#softGlow)" />
        <circle cx="403" cy="304" r="11" fill="#FFFFFF" />
        <circle cx="424" cy="328" r="5.5" fill="#FFFFFF" opacity="0.9" />
      </g>

      <!-- 腮红 -->
      <ellipse cx="220" cy="350" rx="16" ry="8" fill="#F472B6" opacity="0.45" />
      <ellipse cx="440" cy="350" rx="16" ry="8" fill="#F472B6" opacity="0.45" />

      <!-- 微笑嘴巴 -->
      <path d="M 302,352 Q 330,384 358,352" fill="none" stroke="#F59E0B" stroke-width="10" stroke-linecap="round" />
    </g>
  </g>

  <!-- ================= 右侧品牌文字与排版 ================= -->
  <g transform="translate(680, 240)">
    <!-- 类别徽章 -->
    <g>
      <rect x="0" y="0" width="170" height="36" rx="18" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
      <circle cx="20" cy="18" r="5" fill="#10B981" />
      <text x="36" y="24" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1">AI 伴学系统</text>
    </g>

    <!-- 品牌主英文字标: KiddiVision -->
    <text x="0" y="115" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', sans-serif" font-size="82" font-weight="900" letter-spacing="-1">KiddiVision</text>

    <!-- 中文副标: 童视智汇 · 智能 TV 伴学系统 -->
    <g transform="translate(0, 175)">
      <text x="0" y="0" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" letter-spacing="2">童视智汇</text>
      <text x="145" y="0" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="300">｜</text>
      <text x="175" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="500">专为儿童大屏打造的 AI 互动伙伴</text>
    </g>

    <!-- 特性标签胶囊 -->
    <g transform="translate(0, 225)">
      <!-- 标签1 -->
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#1E293B" />
      <text x="16" y="22" fill="#CBD5E1" font-size="14" font-family="sans-serif">🎙️ 语音伴学</text>

      <!-- 标签2 -->
      <rect x="142" y="0" width="130" height="34" rx="8" fill="#1E293B" />
      <text x="158" y="22" fill="#CBD5E1" font-size="14" font-family="sans-serif">📖 拼音注音</text>

      <!-- 标签3 -->
      <rect x="284" y="0" width="145" height="34" rx="8" fill="#1E293B" />
      <text x="300" y="22" fill="#CBD5E1" font-size="14" font-family="sans-serif">📺 科学知识图谱</text>
    </g>
  </g>
</svg>
